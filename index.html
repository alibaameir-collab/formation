<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تكوين Formiton - مش مجرد ماركتنج</title>
    
    <!-- استدعاء خط IBM Plex Sans Arabic -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@200;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ================= الإعدادات العامة ================= */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'IBM Plex Sans Arabic', sans-serif; }
        body { color: #fff; overflow-x: hidden; background-color: #000; }

        /* ================= الخلفية المضببة الشاملة ================= */
        .global-bg {
            position: fixed;
            /* نجعل الأبعاد أكبر قليلاً من الشاشة لإخفاء الحواف الباهتة الناتجة عن الـ blur */
            top: -5%;
            left: -5%;
            width: 110%;
            height: 110vh;
            /* ربط صورة الخلفية "wall.jpg" مع تدرج داكن لضمان وضوح النصوص */
            background: linear-gradient(to bottom, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.85) 100%), 
                        url('wall.jpg') no-repeat center center;
            background-size: cover;
            filter: blur(10px); /* درجة التضبيب */
            z-index: -1; /* إرسالها للخلف تماماً */
            pointer-events: none;
        }

        /* ================= الجزء العلوي (الهيدر) ================= */
        .hero-section {
            position: relative;
            min-height: 480px;
            padding: 40px 5% 0;
            transition: min-height 0.5s ease;
        }

        body.voice-mode .hero-section {
            min-height: auto;
            padding-bottom: 20px;
        }

        .top-bar { display: flex; justify-content: space-between; align-items: flex-start; }
        .logo img, .slogan img { max-width: 150px; height: auto; transition: transform 0.3s ease; }
        .slogan img { max-width: 250px; }
        .logo img:hover, .slogan img:hover { transform: scale(1.05); }

        /* إخفاء شريط التنقل في صفحة المعلقين */
        body.voice-mode .navigation { display: none; }

        .navigation { display: flex; flex-direction: column; align-items: center; gap: 15px; margin-top: 40px; }
        .nav-buttons { display: flex; align-items: center; gap: 15px; }
        .nav-btn {
            background: transparent; color: #fff; border: 1px solid transparent; 
            padding: 8px 30px; border-radius: 30px; font-size: 1.1rem; cursor: pointer; transition: all 0.4s ease;
        }
        .nav-btn:hover { border-color: rgba(255, 255, 255, 0.4); transform: translateY(-2px); }
        .nav-btn.active { border-color: rgba(255, 255, 255, 0.7); background: rgba(255, 255, 255, 0.05); }
        .nav-arrow { color: #fff; font-size: 1.2rem; cursor: pointer; opacity: 0.7; padding: 0 10px; transition: all 0.3s ease; }
        .nav-arrow:hover { opacity: 1; transform: scale(1.2); }
        .dots { display: flex; gap: 8px; margin-top: -5px; }
        .dot { width: 6px; height: 6px; background-color: rgba(255, 255, 255, 0.4); border-radius: 50%; cursor: pointer; transition: all 0.3s ease; }
        .dot.active, .dot:hover { background-color: #fff; }

        /* الانتقالات */
        .fade-in { animation: fadeIn 0.6s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* ================= الصفحة الرئيسية ================= */
        .intro-container { padding: 0 5%; display: flex; justify-content: flex-start; margin-top: 40px; position: relative; z-index: 2; }
        
        .intro-box {
            /* جعلنا الصندوق شفافاً قليلاً ليبرز الخلفية المضببة وراءه */
            background-color: rgba(17, 17, 17, 0.85); 
            border: 1px solid rgba(255,255,255,0.08); padding: 25px 40px;
            border-radius: 40px; max-width: 650px; font-size: 1.1rem; font-weight: 200; line-height: 1.8; color: #ddd;
            backdrop-filter: blur(5px);
        }
        .features-section { display: flex; justify-content: center; flex-wrap: wrap; gap: 40px; padding: 80px 5% 50px; position: relative; }
        .feature-card {
            background: url('خلفية المربعات.png') center center no-repeat; background-size: cover; background-color: #050505;
            border: 1px solid rgba(255,255,255,0.15); border-radius: 20px; width: 280px; padding: 60px 20px 30px; text-align: center;
            position: relative; cursor: pointer; transition: all 0.4s ease;
        }
        .feature-card:hover { transform: translateY(-15px); border-color: rgba(255,255,255,0.4); box-shadow: 0 15px 30px rgba(0,0,0,0.9), 0 0 20px rgba(255,255,255,0.1) inset; }
        .icon-wrapper {
            position: absolute; top: -50px; left: 0; right: 0; margin: 0 auto; width: 100px; height: 100px;
            background: radial-gradient(circle, rgba(60,60,60,1) 0%, rgba(0,0,0,1) 70%); border-radius: 50%;
            display: flex; justify-content: center; align-items: center; box-shadow: 0 0 30px rgba(255, 255, 255, 0.2); transition: all 0.4s ease;
        }
        .feature-card:hover .icon-wrapper { box-shadow: 0 0 50px rgba(255, 255, 255, 0.4); transform: scale(1.1); }
        .icon-wrapper img { width: 45px; height: auto; transition: transform 0.4s ease; }
        .feature-card:hover .icon-wrapper img { transform: scale(1.1); }
        .card-title-img { max-width: 80%; height: auto; margin: 20px auto 15px; display: block; }
        .feature-card p { color: #888; font-size: 0.9rem; font-weight: 200; }
        .feature-card:hover p { color: #fff; }

        /* ================= صفحة اختيار المعلق ================= */
        #voice-section { display: none; padding: 0 5% 80px; text-align: center; }
        
        .back-btn {
            background: transparent; color: #aaa; border: none; font-size: 1.1rem; cursor: pointer;
            display: flex; align-items: center; gap: 10px; margin-bottom: 20px; transition: all 0.3s ease;
        }
        .back-btn:hover { color: #fff; transform: translateX(-5px); }

        /* إطار عنوان الصفحة */
        .voice-title-container {
            background: linear-gradient(180deg, rgba(24,24,24,0.9) 0%, rgba(5,5,5,0.9) 100%);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 50px;
            padding: 20px 50px;
            display: inline-block;
            margin-bottom: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
        }
        .voice-title-img { height: 25px; width: auto; display: block; }

        .voice-cards-container { display: flex; flex-direction: column; align-items: center; gap: 20px; }

        /* تصميم البطاقة الأفقية */
        .voice-item {
            background: url('خلفية مربع الصوت.png') center center no-repeat;
            background-size: cover;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 60px;
            width: 100%;
            max-width: 750px;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
        }
        .voice-item:hover { border-color: rgba(255,255,255,0.4); box-shadow: 0 5px 20px rgba(0,0,0,0.6); }

        /* الجانب الأيمن (الصورة + النص) */
        .voice-info-group { display: flex; align-items: center; gap: 15px; width: 260px; }
        
        .voice-avatar-box {
            width: 60px; height: 60px; border-radius: 50%;
            background-color: #fff; display: flex; justify-content: center; align-items: center; padding: 2px;
        }
        .voice-avatar-box img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        
        .voice-text-details { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
        .v-type { height: 14px; width: auto; object-fit: contain; }
        .v-name { height: 20px; width: auto; object-fit: contain; }

        /* الجانب الأيسر (زر التشغيل) */
        .play-btn-wrapper {
            width: 60px; height: 60px; border-radius: 50%;
            background: radial-gradient(circle, #333 0%, #111 80%, #000 100%);
            display: flex; justify-content: center; align-items: center;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8), 0 0 10px rgba(0,0,0,0.5);
            cursor: pointer; transition: all 0.3s ease; border: 1px solid rgba(255,255,255,0.1);
        }
        .play-btn-wrapper:hover { transform: scale(1.05); background: radial-gradient(circle, #444 0%, #222 80%, #000 100%); }
        .play-btn-wrapper img { width: 20px; height: auto; margin-right: -4px; }

        /* المنتصف (الموجات الصوتية المتطابقة مع الصورة) */
        .waveform-container {
            display: flex; align-items: center; justify-content: center; gap: 3px;
            flex-grow: 1; margin: 0 20px; opacity: 0.3; transition: opacity 0.3s ease;
        }
        .w-bar { width: 2px; background-color: #fff; border-radius: 2px; transition: transform 0.2s ease; }
        
        /* تفعيل الموجات عند التشغيل */
        .voice-item.is-playing { border-color: rgba(255, 255, 255, 0.6); box-shadow: 0 0 20px rgba(255, 255, 255, 0.1); }
        .voice-item.is-playing .waveform-container { opacity: 1; }
        .voice-item.is-playing .w-bar { animation: pulse-wave 0.5s infinite alternate; }
        .voice-item.is-playing .play-btn-wrapper img { opacity: 0.4; }

        @keyframes pulse-wave { 0% { transform: scaleY(0.6); } 100% { transform: scaleY(1.5); } }

        /* إعطاء حركات عشوائية للموجات */
        .w-bar:nth-child(odd) { animation-delay: 0.1s; animation-duration: 0.4s; }
        .w-bar:nth-child(even) { animation-delay: 0.2s; animation-duration: 0.6s; }
        .w-bar:nth-child(3n) { animation-delay: 0.3s; animation-duration: 0.5s; }

        @media (max-width: 768px) {
            .top-bar { flex-direction: column; align-items: center; gap: 20px; }
            .voice-item { flex-direction: column; border-radius: 30px; padding: 20px; gap: 20px; }
            .voice-info-group { width: 100%; justify-content: center; }
            .waveform-container { margin: 10px 0; }
        }
    </style>
</head>
<body>

    <!-- الخلفية المضببة التي ستطبق على كل الصفحات -->
    <div class="global-bg"></div>

    <!-- الهيدر -->
    <header class="hero-section">
        <div class="top-bar">
            <div class="logo"><img src="الشعار.png" alt="Formiton Logo"></div>
            <div class="slogan"><img src="مش مجـــرد  ماركتنـــج.png" alt="مش مجرد ماركتنج"></div>
        </div>

        <div class="navigation">
            <div class="nav-buttons">
                <i class="fas fa-chevron-right nav-arrow"></i>
                <button class="nav-btn">الباقات</button>
                <button class="nav-btn active">الرئيسية</button>
                <button class="nav-btn">اعمالنا</button>
                <i class="fas fa-chevron-left nav-arrow"></i>
            </div>
            <div class="dots"><span class="dot"></span><span class="dot active"></span><span class="dot"></span></div>
        </div>
    </header>

    <!-- ================= القسم الرئيسي ================= -->
    <div id="main-section" class="fade-in">
        <section class="intro-container">
            <div class="intro-box">
                في عالم مليان منافسة، تحتاج أكثر من مجرد إعلانات عادية..<br>
                تحتاج شريك يفهم رؤيتك ويحولها لنتائج ملموسة! وهنا يجي دور فورميشن
            </div>
        </section>

        <section class="features-section">
            <div class="feature-card">
                <div class="icon-wrapper"><img src="استبيان.png" alt="أيقونة استبيان"></div>
                <img class="card-title-img" src="إستبيان الأفكــار.png" alt="تعبئة إستبيان الأفكار">
                <p>استبيان لتحديد التوجه والتفكير</p>
            </div>
            <div class="feature-card">
                <div class="icon-wrapper"><img src="مونتاج.png" alt="أيقونة مونتاج"></div>
                <img class="card-title-img" src="نوع المونتــــاج.png" alt="إختيار نوع المونتاج">
                <p>لتحديد نوعية المونتاج المطلوبة</p>
            </div>
            <div class="feature-card" onclick="openVoiceSection()">
                <div class="icon-wrapper"><img src="تعليق صوتي.png" alt="أيقونة تعليق صوتي"></div>
                <img class="card-title-img" src="معلـــق صوتي.png" alt="إختيار معلق صوتي">
                <p>اختيار معلقك الصوتي لاعمالك</p>
            </div>
        </section>
    </div>

    <!-- ================= قسم اختيار المعلق ================= -->
    <div id="voice-section">
        <button class="back-btn" onclick="openMainSection()"><i class="fas fa-arrow-right"></i> رجوع</button>

        <!-- عنوان الصفحة -->
        <div class="voice-title-container">
            <img class="voice-title-img" src="أختر من يمثــل صــــوت مشروعــــك.png" alt="أختر من يمثل صوت مشروعك">
        </div>

        <div class="voice-cards-container">
            
            <!-- المعلق الأول: عبدالله حديجان -->
            <div class="voice-item">
                <div class="voice-info-group">
                    <div class="voice-avatar-box"><img src="female-avatar.png" alt="صورة المعلق"></div>
                    <div class="voice-text-details">
                        <img class="v-type" src="صوت طبيعي.png" alt="صوت طبيعي">
                        <img class="v-name" src="عبدالله حديجـــــان.png" alt="عبدالله حديجان">
                    </div>
                </div>
                
                <div class="waveform-container" id="wave1"></div>
                
                <div class="play-btn-wrapper" onclick="toggleAudio(this, 'lahajati______1787685203422.mp3')">
                    <img src="play.png" alt="تشغيل">
                </div>
            </div>

            <!-- المعلق الثاني: هاشم الجيلاني -->
            <div class="voice-item">
                <div class="voice-info-group">
                    <div class="voice-avatar-box"><img src="female-avatar.png" alt="صورة المعلق"></div>
                    <div class="voice-text-details">
                        <img class="v-type" src="صوت قرار.png" alt="صوت قرار">
                        <img class="v-name" src="هاشـــم الجيلاني.png" alt="هاشم الجيلاني">
                    </div>
                </div>
                
                <div class="waveform-container" id="wave2"></div>
                
                <div class="play-btn-wrapper" onclick="toggleAudio(this, 'lahajati______1787685203422.mp3')">
                    <img src="play.png" alt="تشغيل">
                </div>
            </div>

            <!-- المعلق الثالث: إبراهيم ال عبدالكريم -->
            <div class="voice-item">
                <div class="voice-info-group">
                    <div class="voice-avatar-box"><img src="female-avatar.png" alt="صورة المعلق"></div>
                    <div class="voice-text-details">
                        <img class="v-type" src="صوت طبيعي.png" alt="صوت طبيعي">
                        <img class="v-name" src="إبراهيم ال عبدالكريم.png" alt="إبراهيم ال عبدالكريم">
                    </div>
                </div>
                
                <div class="waveform-container" id="wave3"></div>
                
                <div class="play-btn-wrapper" onclick="toggleAudio(this, 'lahajati______1787685203422.mp3')">
                    <img src="play.png" alt="تشغيل">
                </div>
            </div>

        </div>
    </div>

    <!-- الجافاسكربت -->
    <script>
        // توليد الموجات الصوتية
        const waveHeights = [4, 8, 15, 6, 20, 10, 5, 25, 12, 6, 18, 30, 22, 10, 5, 15, 28, 12, 8, 20, 35, 15, 8, 25, 12, 6, 18, 10, 5, 12, 6, 20, 8, 4];
        
        function generateWaveforms() {
            let waveHTML = '';
            waveHeights.forEach(h => { waveHTML += `<div class="w-bar" style="height: ${h}px;"></div>`; });
            document.getElementById('wave1').innerHTML = waveHTML;
            document.getElementById('wave2').innerHTML = waveHTML;
            document.getElementById('wave3').innerHTML = waveHTML;
        }
        generateWaveforms();

        // التحكم في التنقل
        function openVoiceSection() {
            document.body.classList.add('voice-mode'); 
            document.getElementById('main-section').style.display = 'none';
            let voiceSection = document.getElementById('voice-section');
            voiceSection.style.display = 'block';
            voiceSection.classList.add('fade-in');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function openMainSection() {
            document.body.classList.remove('voice-mode'); 
            document.getElementById('voice-section').style.display = 'none';
            let mainSection = document.getElementById('main-section');
            mainSection.style.display = 'block';
            mainSection.classList.add('fade-in');
            
            if(audioPlayer && !audioPlayer.paused) {
                audioPlayer.pause();
                if(currentVoiceItem) currentVoiceItem.classList.remove('is-playing');
            }
        }

        // مشغل الصوت
        let audioPlayer = new Audio();
        let currentVoiceItem = null;

        function toggleAudio(btnElement, audioSrc) {
            const voiceItem = btnElement.closest('.voice-item');

            if (currentVoiceItem === voiceItem && !audioPlayer.paused) {
                audioPlayer.pause();
                voiceItem.classList.remove('is-playing');
                return;
            }

            if (currentVoiceItem) { currentVoiceItem.classList.remove('is-playing'); }

            audioPlayer.src = audioSrc;
            audioPlayer.play();
            
            voiceItem.classList.add('is-playing');
            currentVoiceItem = voiceItem;

            audioPlayer.onended = () => {
                voiceItem.classList.remove('is-playing');
                currentVoiceItem = null;
            };
        }
    </script>

</body>
</html>
